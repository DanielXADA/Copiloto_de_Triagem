services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./copilot-clinic-interface-main:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite dev server host allowlist — platform sets this; Vite >= 6.1 appends it
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 3000"
