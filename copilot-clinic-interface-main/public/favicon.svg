<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="copiloto-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container com cantos suaves -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#copiloto-grad)" filter="url(#glow)" />
  
  <!-- Cruz Médica Suave de Fundo -->
  <rect x="26" y="14" width="12" height="36" rx="6" fill="#ffffff" fill-opacity="0.2" />
  <rect x="14" y="26" width="36" height="12" rx="6" fill="#ffffff" fill-opacity="0.2" />

  <!-- Pulso Eletrocardiograma Médico + Copiloto IA -->
  <path
    d="M 12 32 L 22 32 L 27 21 L 34 44 L 40 25 L 44 34 L 47 32 L 52 32"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Ponto de Conexão Inteligente -->
  <circle cx="34" cy="44" r="2.5" fill="#38bdf8" />
  <circle cx="40" cy="25" r="2.5" fill="#38bdf8" />
</svg>
